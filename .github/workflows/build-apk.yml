<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#54151c">
<title>Grade-12 Learning Hub</title>

<style>
:root{
 --m:#54151c;--m2:#7b252e;--g:#d1a84a;
 --bg:#fbf8f3;--tx:#292222;--line:#eadfd5
}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:var(--tx);
 font-family:Arial,"Padauk",sans-serif
}
.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:72px}

.splash{
 position:fixed;inset:0;background:linear-gradient(135deg,#54151c,#27070a);
 z-index:100;display:flex;align-items:center;justify-content:center;
 color:white;text-align:center
}
.splashBox{padding:30px}
.splashLogo{
 width:120px;height:120px;border-radius:50%;background:white;
 display:grid;place-items:center;font-size:60px;
 margin:auto;border:6px solid #d1a84a;
 box-shadow:0 0 30px #d1a84a66
}
.splash h1{font-size:25px;color:#f7e9b9;margin:28px 0 8px}
.splash p{margin:0;font-size:15px}
.line{width:220px;height:7px;background:#f7e9b9;border-radius:20px;margin:28px auto}

header{
 padding:20px 18px;background:linear-gradient(135deg,var(--m),#27070a);
 color:white;border-bottom:3px solid var(--g);
 border-radius:0 0 24px 24px
}
.head{display:flex;align-items:center;gap:12px}
.logo{
 width:48px;height:48px;border-radius:15px;background:#fff;
 display:grid;place-items:center;font-size:25px
}
h1{font-size:19px;margin:0;color:#f7e9b9}
header p{margin:4px 0 0;font-size:12px;opacity:.8}

.page{display:none;padding:18px}
.page.active{display:block}

.hero,.card,.item,.stat{
 background:#fff;border:1px solid var(--line);
 border-radius:17px;box-shadow:0 5px 16px #00000008
}
.hero{padding:20px}
.hero h2,.title h2{color:var(--m)}

.stats,.grid{
 display:grid;gap:10px;margin-top:13px
}
.stats{grid-template-columns:repeat(3,1fr)}
.grid{grid-template-columns:1fr 1fr}
.stat{text-align:center;padding:12px}
.stat b{display:block;font-size:20px;color:var(--m)}
.stat small{color:#777}

.card{padding:17px}
.card .ico{font-size:28px}
.card b{display:block;margin-top:8px;color:var(--m)}

.title{
 display:flex;justify-content:space-between;
 align-items:center;gap:8px;margin-bottom:12px
}
.title h2{margin:0;font-size:19px}
.add{
 border:0;border-radius:10px;padding:9px 12px;
 background:var(--m);color:#f7e9b9;font-weight:bold
}

input,textarea,select{
 width:100%;padding:12px;border:1px solid #ddcfc4;
 border-radius:10px;margin-bottom:9px;background:#fff;font:inherit
}
textarea{min-height:100px}

.list{display:grid;gap:11px}
.item{
 padding:15px;position:relative
}
.item b{
 display:block;color:var(--m);
 padding-right:55px;margin-bottom:7px
}
.item small{white-space:pre-wrap;line-height:1.55}

.del{
 position:absolute;right:9px;top:9px;border:0;
 background:#ffe0e0;color:#a00;border-radius:6px;
 padding:5px 8px;font-size:10px
}

.fileBox{
 border:1px dashed #cdbdb1;
 border-radius:12px;padding:14px;
 background:#faf7f3;margin-bottom:10px
}
.fileBtn{
 display:block;text-align:center;padding:12px;
 background:var(--m);color:#f7e9b9;
 border-radius:10px;font-weight:bold
}

.fileLink{
 display:inline-block;margin-top:8px;
 padding:8px 12px;background:#f0e5dd;
 border-radius:8px;color:var(--m);
 text-decoration:none;font-weight:bold;font-size:13px
}

.choice{
 width:100%;text-align:left;border:1px solid #e5d8ce;
 background:#fbf7f2;border-radius:9px;
 padding:10px;margin:4px 0
}
.correct{background:#d8f0dd!important}
.wrong{background:#f7d8d8!important}

.empty{
 text-align:center;padding:28px;color:#888;
 background:#fff;border:1px dashed #d8c8bb;
 border-radius:15px
}

.media{width:100%;margin-top:8px;border-radius:10px}

.nav{
 position:fixed;bottom:0;left:50%;
 transform:translateX(-50%);
 width:min(520px,100%);height:64px;
 background:#fff;border-top:1px solid var(--line);
 display:grid;grid-template-columns:repeat(5,1fr);
 z-index:5
}
.nav button{
 border:0;background:none;color:#888;font-size:10px
}
.nav button span{display:block;font-size:19px}
.nav button.active{color:var(--m);font-weight:bold}

.modal{
 display:none;position:fixed;inset:0;background:#0008;
 z-index:20;align-items:flex-end
}
.modal.show{display:flex}
.sheet{
 width:min(520px,100%);background:#fff;
 border-radius:20px 20px 0 0;padding:20px;
 max-height:88vh;overflow:auto;border-top:3px solid var(--g)
}
.actions{display:flex;gap:8px}
.actions button{
 flex:1;padding:11px;border:0;border-radius:10px;font-weight:bold
}
.save{background:var(--m);color:#f7e9b9}
.cancel{background:#eee}
</style>
</head>

<body>

<div class="splash" id="splash">
 <div class="splashBox">
  <div class="splashLogo">🎓</div>
  <h1>GRADE-12 LEARNING</h1>
  <p>Student Learning Hub</p>
  <div class="line"></div>
  <p>📡 စာတွေကို နှစ်မြှုပ်စွာ လေ့လာပါ</p>
 </div>
</div>

<div class="app">

<header>
 <div class="head">
  <div class="logo">🎓</div>
  <div>
   <h1>GRADE-12 LEARNING</h1>
   <p>Student Learning Hub</p>
  </div>
 </div>
</header>

<section id="home" class="page active">

<div class="hero">
 <h2>မင်္ဂလာပါ 👋</h2>
 <p>
 Grade-12 သင်ခန်းစာ၊ မှတ်စု၊ PDF၊ TXT၊ DOC၊ DOCX၊
 MCQ၊ Video နဲ့ Music တွေကို တစ်နေရာတည်းမှာ လေ့လာနိုင်ပါတယ်။
 </p>

 <div class="stats">
  <div class="stat"><b id="ncnt">0</b><small>မှတ်စု</small></div>
  <div class="stat"><b id="qcnt">0</b><small>MCQ</small></div>
  <div class="stat"><b id="fcnt">0</b><small>Files</small></div>
 </div>
</div>

<div class="grid">
 <div class="card" onclick="go('notes')">
  <div class="ico">📚</div>
  <b>မှတ်စုများ</b>
  <small>Lessons & Files</small>
 </div>

 <div class="card" onclick="go('practice')">
  <div class="ico">📝</div>
  <b>လေ့ကျင့်ခန်း</b>
  <small>MCQ Practice</small>
 </div>

 <div class="card" onclick="go('videos')">
  <div class="ico">🎬</div>
  <b>Videos</b>
  <small>Lesson Videos</small>
 </div>

 <div class="card" onclick="go('music')">
  <div class="ico">🎵</div>
  <b>Music</b>
  <small>Audio Player</small>
 </div>
</div>

</section>

<section id="notes" class="page">

<div class="title">
 <h2>📚 မှတ်စုများ</h2>
 <button class="add" onclick="openM('noteM')">＋ ထည့်မယ်</button>
</div>

<input id="search" placeholder="🔍 မှတ်စုရှာရန်..." oninput="renderNotes()">

<div id="notesList" class="list"></div>

</section>

<section id="practice" class="page">

<div class="title">
 <h2>📝 MCQ</h2>
 <button class="add" onclick="openM('quizM')">＋ Add Quiz</button>
</div>

<div id="quizList" class="list"></div>

</section>

<section id="videos" class="page">

<div class="title">
 <h2>🎬 Videos</h2>
 <button class="add" onclick="videoInput.click()">＋ Add</button>
</div>

<input id="videoInput" type="file" accept="video/*" hidden onchange="addVideo(this)">
<div id="videoList" class="list"></div>

</section>

<section id="music" class="page">

<div class="title">
 <h2>🎵 Music</h2>
 <button class="add" onclick="audioInput.click()">＋ Add</button>
</div>

<input id="audioInput" type="file" accept="audio/*" hidden onchange="addMusic(this)">
<div id="musicList" class="list"></div>

</section>

<nav class="nav">
<button class="active" onclick="go('home',this)">
<span>🏠</span>Home
</button>

<button onclick="go('notes',this)">
<span>📚</span>Notes
</button>

<button onclick="go('practice',this)">
<span>📝</span>Practice
</button>

<button onclick="go('videos',this)">
<span>🎬</span>Videos
</button>

<button onclick="go('music',this)">
<span>🎵</span>Music
</button>
</nav>

</div>

<!-- NOTE MODAL -->

<div class="modal" id="noteM">

<div class="sheet">

<h3>✏️ မှတ်စုအသစ်</h3>

<input id="ns" placeholder="Subject">
<input id="ch" placeholder="Chapter / Title">

<textarea id="nt" placeholder="မှတ်စုရေးပါ..."></textarea>

<div class="fileBox">
 <b>📄 PDF / TXT / DOC / DOCX ဖိုင်ထည့်ရန်</b>
 <br><br>

 <label class="fileBtn">
  📂 File ရွေးမယ်
  <input
   id="noteFile"
   type="file"
   accept=".pdf,.txt,.doc,.docx"
   hidden
  >
 </label>

 <small id="fileName">ဖိုင်မရွေးရသေးပါ</small>
</div>

<div class="actions">
 <button class="save" onclick="saveNote()">Save</button>
 <button class="cancel" onclick="closeM('noteM')">Cancel</button>
</div>

</div>
</div>

<!-- QUIZ -->

<div class="modal" id="quizM">

<div class="sheet">

<h3>📝 MCQ အသစ်</h3>

<input id="qq" placeholder="မေးခွန်း">
<input id="a" placeholder="Option A">
<input id="b" placeholder="Option B">
<input id="c" placeholder="Option C">
<input id="d" placeholder="Option D">

<select id="correct">
<option value="0">အဖြေမှန် A</option>
<option value="1">အဖြေမှန် B</option>
<option value="2">အဖြေမှန် C</option>
<option value="3">အဖြေမှန် D</option>
</select>

<div class="actions">
<button class="save" onclick="saveQuiz()">Save</button>
<button class="cancel" onclick="closeM('quizM')">Cancel</button>
</div>

</div>
</div>

<script>

const K="G12_HUB_V4";

let data={
 notes:[],
 quizzes:[],
 files:[]
};

try{
 data=JSON.parse(localStorage.getItem(K))||data;
}catch(e){}

const esc=s=>String(s||"").replace(
 /[&<>'"]/g,
 x=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  "'":"&#39;",
  '"':"&quot;"
 }[x])
);

const save=()=>{
 localStorage.setItem(K,JSON.stringify(data));
};

function go(id,btn){

 document.querySelectorAll(".page")
 .forEach(x=>x.classList.remove("active"));

 document.getElementById(id)
 .classList.add("active");

 document.querySelectorAll(".nav button")
 .forEach(x=>x.classList.remove("active"));

 if(btn)btn.classList.add("active");

 stats();
}

function openM(id){
 document.getElementById(id).classList.add("show");
}

function closeM(id){
 document.getElementById(id).classList.remove("show");
}

function stats(){

 ncnt.textContent=data.notes.length;
 qcnt.textContent=data.quizzes.length;
 fcnt.textContent=data.notes.filter(x=>x.file).length;
}

document.getElementById("noteFile").onchange=function(){

 if(this.files[0]){
  fileName.textContent="📄 "+this.files[0].name;
 }else{
  fileName.textContent="ဖိုင်မရွေးရသေးပါ";
 }
};

function saveNote(){

 let s=ns.value.trim();
 let t=ch.value.trim();
 let n=nt.value.trim();
 let file=noteFile.files[0];

 if(!s||!t||!n){

  alert("Subject၊ Chapter နဲ့ မှတ်စု ဖြည့်ပါ");
  return;
 }

 let note={
  id:Date.now(),
  s:s,
  t:t,
  n:n,
  file:null
 };

 if(file){

  let reader=new FileReader();

  reader.onload=function(){

   note.file={
    name:file.name,
    type:file.type,
    data:reader.result
   };

   data.notes.unshift(note);
   save();
   renderNotes();

   ns.value="";
   ch.value="";
   nt.value="";
   noteFile.value="";
   fileName.textContent="ဖိုင်မရွေးရသေးပါ";

   closeM("noteM");
  };

  reader.readAsDataURL(file);

 }else{

  data.notes.unshift(note);
  save();
  renderNotes();

  ns.value="";
  ch.value="";
  nt.value="";

  closeM("noteM");
 }
}

function renderNotes(){

 let k=(search.value||"").toLowerCase();

 let arr=data.notes.filter(x=>
  (x.s+x.t+x.n+(x.file?.name||""))
  .toLowerCase()
  .includes(k)
 );

 notesList.innerHTML=arr.length?
 arr.map(x=>{

  let fileHtml="";

  if(x.file){

   fileHtml=`
   <div class="fileBox">
    📄 <b>${esc(x.file.name)}</b>
    <br>
    <a class="fileLink"
       href="${x.file.data}"
       target="_blank"
       download="${esc(x.file.name)}">
       📂 ဖိုင်ဖွင့် / သိမ်းမယ်
    </a>
   </div>
   `;
  }

  return `
  <div class="item">

   <button class="del"
   onclick="delNote(${x.id})">
   Delete
   </button>

   <b>📘 ${esc(x.s)} — ${esc(x.t)}</b>

   <small>${esc(x.n)}</small>

   ${fileHtml}

  </div>
  `;

 }).join("")

 :

 `<div class="empty">
 📚 မှတ်စုမရှိသေးပါ
 </div>`;

 stats();
}

function delNote(id){

 if(confirm("မှတ်စုဖျက်မလား?")){

  data.notes=data.notes.filter(x=>x.id!=id);

  save();
  renderNotes();
 }
}

function saveQuiz(){

 let q=qq.value.trim();

 let ans=[
  a.value.trim(),
  b.value.trim(),
  c.value.trim(),
  d.value.trim()
 ];

 if(!q||ans.some(x=>!x)){

  alert("မေးခွန်းနှင့် Option ၄ ခု ဖြည့်ပါ");
  return;
 }

 data.quizzes.push({
  id:Date.now(),
  q:q,
  ans:ans,
  c:+correct.value
 });

 save();
 renderQuiz();

 [qq,a,b,c,d].forEach(x=>x.value="");

 closeM("quizM");
}

function renderQuiz(){

 quizList.innerHTML=data.quizzes.length?

 data.quizzes.map((x,j)=>`

 <div class="item">

 <button class="del"
 onclick="delQuiz(${x.id})">
 Delete
 </button>

 <b>${j+1}. ${esc(x.q)}</b>

 ${x.ans.map((v,i)=>`

 <button class="choice"
 onclick="answer(${x.id},${i},this)">
 ${String.fromCharCode(65+i)}. ${esc(v)}
 </button>

 `).join("")}

 <small id="r${x.id}"></small>

 </div>

 `).join("")

 :

 `<div class="empty">
 📝 MCQ မရှိသေးပါ
 </div>`;

 stats();
}

function delQuiz(id){

 if(confirm("Quiz ဖျက်မလား?")){

  data.quizzes=data.quizzes.filter(x=>x.id!=id);

  save();
  renderQuiz();
 }
}

function answer(id,i,btn){

 let q=data.quizzes.find(x=>x.id==id);

 btn.parentElement
 .querySelectorAll(".choice")
 .forEach(x=>x.disabled=true);

 let r=document.getElementById("r"+id);

 if(i==q.c){

  btn.classList.add("correct");
  r.textContent="✅ မှန်ပါတယ်";

 }else{

  btn.classList.add("wrong");
  r.textContent=
   "❌ မှားပါတယ် — အဖြေမှန် "+
   String.fromCharCode(65+q.c);
 }
}

function addMusic(input){

 let f=input.files[0];

 if(!f)return;

 let u=URL.createObjectURL(f);

 let x=document.createElement("div");

 x.className="item";

 x.innerHTML=`

 <button class="del"
 onclick="this.parentElement.remove();stats()">
 Delete
 </button>

 <b>🎵 ${esc(f.name)}</b>

 <audio class="media"
 controls src="${u}">
 </audio>
 `;

 musicList.prepend(x);

 input.value="";

 stats();
}

function addVideo(input){

 let f=input.files[0];

 if(!f)return;

 let u=URL.createObjectURL(f);

 let x=document.createElement("div");

 x.className="item";

 x.innerHTML=`

 <button class="del"
 onclick="this.parentElement.remove();stats()">
 Delete
 </button>

 <b>🎬 ${esc(f.name)}</b>

 <video class="media"
 controls src="${u}">
 </video>
 `;

 videoList.prepend(x);

 input.value="";

 stats();
}

addEventListener("DOMContentLoaded",()=>{

 renderNotes();
 renderQuiz();
 stats();

 setTimeout(()=>{
  document.getElementById("splash").style.display="none";
 },2200);

});

</script>

</body>
</html>
